services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget_tracker
    ports:
      - "5432:5432"
    volumes:
      - budget_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://budget:budget@postgres:5432/budget_tracker
      API_KEY: ${API_KEY:-dev-api-key}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://localhost:8000/mcp}
      OAUTH_OWNER_PASSWORD_HASH: ${OAUTH_OWNER_PASSWORD_HASH:-$$2b$$12$$3xy.vALBgjUWyqFodMURV.NkzZ4.AnAxElTs3rp4Jk4ZmxU/LxT7y}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  budget_tracker_pgdata:
