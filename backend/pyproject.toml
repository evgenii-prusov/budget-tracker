[project]
name = "app"
version = "0.1.0"
description = "Budget Tracker Backend API"
readme = "README.md"
# FastAPI/Pydantic do not yet support Python 3.14; pin to supported versions.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.131.0",
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.15.0",
]

[dependency-groups]
dev = [
    "prek>=0.3.3",
    "pytest>=7.4.4",
    "pytest-cov>=6.0.0",
    "pytest-sugar>=1.0.0",
    "ruff>=0.15.02",
    "testcontainers[postgres]>=4.0.0",
    "ty>=0.0.18",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.ty]
rules = { invalid-argument-type = "ignore" }
